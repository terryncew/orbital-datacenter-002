<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect width="1100" height="720" fill="#0f172a"/>
  <rect x="20" y="20" width="1060" height="680" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="40" y="55" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold">
    ORBITAL DATA CENTER 002 — NON-ENERGIZED TVAC PROTOTYPE PACKET: O_ROUND2 HOT-SWAP OHP SPINE COUPON
  </text>
  <text x="40" y="80" fill="#94a3b8" font-family="monospace" font-size="13">
    SCALE: 160.0 mm x 120.0 mm x 8.8 mm | DRY-CLAMPED PGS + MULTI-SPRING TIM (0 FLUID QDCs) | STATUS: NON-ENERGIZED TVAC COUPON (ENERGIZED = HOLD)
  </text>
  <rect x="60" y="130" width="480" height="360" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="75" y="145" width="450" height="330" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <g stroke="#22d3ee" stroke-width="1.2" opacity="0.75">
    <line x1="95" y1="160" x2="505" y2="160"/><line x1="95" y1="185" x2="505" y2="185"/>
    <line x1="95" y1="210" x2="505" y2="210"/><line x1="95" y1="235" x2="505" y2="235"/>
    <line x1="95" y1="260" x2="505" y2="260"/><line x1="95" y1="285" x2="505" y2="285"/>
    <line x1="95" y1="310" x2="505" y2="310"/><line x1="95" y1="335" x2="505" y2="335"/>
    <line x1="95" y1="360" x2="505" y2="360"/><line x1="95" y1="385" x2="505" y2="385"/>
    <line x1="95" y1="410" x2="505" y2="410"/><line x1="95" y1="435" x2="505" y2="435"/>
  </g>
  <rect x="165" y="175" width="270" height="270" fill="#0f766e" fill-opacity="0.55" stroke="#2dd4bf" stroke-width="2.5"/>
  <rect x="165" y="145" width="270" height="24" fill="#b45309" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="165" y="451" width="270" height="24" fill="#b45309" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="129" y="175" width="24" height="270" fill="#b45309" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="447" y="175" width="24" height="270" fill="#b45309" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="190" y="305" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">REMOVABLE INERT SURROGATE</text>
  <text x="190" y="325" fill="#cbd5e1" font-family="monospace" font-size="12">90.0 x 90.0 mm Dry-Clamp Blade</text>
  <text x="190" y="345" fill="#cbd5e1" font-family="monospace" font-size="12">Clamped PGS + Multi-Spring TIM</text>
  <text x="60" y="520" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">
    TOP VIEW: 160.0 mm x 120.0 mm Al-6061-T6 FSW Cellular OHP Spine + Kinematic Wedge Clamps
  </text>
  <rect x="590" y="130" width="460" height="530" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="610" y="162" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">CROSS-SECTION &amp; TVAC QUALIFICATION GATES</text>
  <text x="610" y="192" fill="#e2e8f0" font-family="monospace" font-size="12">1. Solid B-Rep STEP: 12 CLOSED_SHELLs, V-E+F = 2 exact</text>
  <text x="610" y="216" fill="#e2e8f0" font-family="monospace" font-size="12">2. Base Spine: 5.0 mm Al-6061-T6 FSW Cellular OHP</text>
  <text x="610" y="240" fill="#e2e8f0" font-family="monospace" font-size="12">3. Solid Power Bus: 0.6 mm Polyimide/Cu 800V Return</text>
  <text x="610" y="264" fill="#e2e8f0" font-family="monospace" font-size="12">4. Dry Interface: 0.8 mm Pyrolytic Graphite + BeCu</text>
  <text x="610" y="288" fill="#e2e8f0" font-family="monospace" font-size="12">   Multi-Spring Array (45 kPa kinematic wedge preload)</text>
  <text x="610" y="312" fill="#e2e8f0" font-family="monospace" font-size="12">5. Swappable Blade: 2.4 mm AlN/Al Surrogate Cartridge</text>
  <text x="610" y="350" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold">FALSIFICATION &amp; ACCEPTANCE THRESHOLDS:</text>
  <text x="610" y="376" fill="#cbd5e1" font-family="monospace" font-size="12">* Gate G1 (Dry Mass): &lt;= 62% of solid Al-6061 plate</text>
  <text x="610" y="398" fill="#cbd5e1" font-family="monospace" font-size="12">  at matched 3-point bending stiffness EI (+/-5%).</text>
  <text x="610" y="422" fill="#cbd5e1" font-family="monospace" font-size="12">* Gate G2 (Hermeticity): He leak &lt; 1e-8 atm-cc/s</text>
  <text x="610" y="444" fill="#cbd5e1" font-family="monospace" font-size="12">  across all 8 independent cellular OHP loops.</text>
  <text x="610" y="468" fill="#cbd5e1" font-family="monospace" font-size="12">* Gate G3 (Dry-Clamp Thermal Contact in 1e-5 Torr):</text>
  <text x="610" y="490" fill="#cbd5e1" font-family="monospace" font-size="12">  Contact drop dT_clamp &lt;= 1.8 K at 50 W SELV after</text>
  <text x="610" y="512" fill="#cbd5e1" font-family="monospace" font-size="12">  20 mechanical latch/unlatch cycles in vacuum.</text>
  <text x="610" y="536" fill="#cbd5e1" font-family="monospace" font-size="12">* Gate G4 (Falsifier): If dT_clamp &gt; 3.5 K after</text>
  <text x="610" y="558" fill="#cbd5e1" font-family="monospace" font-size="12">  20 cycles, REJECT O_ROUND2 hot-swap and revert</text>
  <text x="610" y="580" fill="#cbd5e1" font-family="monospace" font-size="12">  to N_ROUND1 monolithic bonded spine.</text>
  <text x="610" y="620" fill="#f87171" font-family="monospace" font-size="12" font-weight="bold">SAFETY: NON-ENERGIZED COUPON ONLY. DO NOT ENERGIZE</text>
  <text x="610" y="640" fill="#f87171" font-family="monospace" font-size="12" font-weight="bold">WITHOUT EXTERNAL PE/EHS REVIEW AND OWNER APPROVAL.</text>
</svg>